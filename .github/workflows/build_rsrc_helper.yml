name: Build rsrc helper
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'rsrc-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build rsrc
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          cp "$HOME/go/bin/rsrc" ./rsrc_linux_amd64
          chmod +x ./rsrc_linux_amd64
          ./rsrc_linux_amd64 -h || true
      - uses: actions/upload-artifact@v4
        with:
          name: rsrc_linux_amd64
          path: rsrc_linux_amd64
          retention-days: 1
          compression-level: 0
