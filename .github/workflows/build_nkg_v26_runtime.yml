name: Build NKG v2.6 Secure Web Runtime
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'runtime-v26-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Build private runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "out"
          $runtime = Join-Path $root "_runtime"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $installer = Join-Path $root "python-3.11.9-amd64.exe"
          Invoke-WebRequest -UseBasicParsing "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe" -OutFile $installer
          $args = @("/quiet","InstallAllUsers=0","TargetDir=$runtime","Include_pip=1","Include_tcltk=1","Include_test=0","Include_doc=0","Include_launcher=0","AssociateFiles=0","Shortcuts=0","PrependPath=0","CompileAll=0")
          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Python installer failed: $($p.ExitCode)" }
          & "$runtime\python.exe" -m pip install --disable-pip-version-check --no-warn-script-location openpyxl==3.1.5 reportlab==4.4.3 pillow==11.3.0 charset-normalizer==3.4.3 fastapi==0.116.1 "uvicorn[standard]==0.35.0" python-multipart==0.0.20 jinja2==3.1.6 PyMuPDF==1.26.3
          & "$runtime\python.exe" -c "import tkinter,openpyxl,reportlab,PIL,fastapi,uvicorn,jinja2,fitz,multipart; print('NKG v2.6 runtime ok')"
          Remove-Item $installer -Force
          Get-ChildItem -Recurse -Force "$runtime\Lib\site-packages" -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$root\cloudflared.exe"
          if ((Get-Item "$root\cloudflared.exe").Length -lt 1000000) { throw "cloudflared download failed" }
          Compress-Archive -Path "$runtime\*" -DestinationPath "$root\NKG_v26_Runtime_x64.zip" -CompressionLevel Optimal

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: NKG_v26_Runtime_x64
          path: out/NKG_v26_Runtime_x64.zip
          retention-days: 1
          compression-level: 0

      - name: Upload cloudflared
        uses: actions/upload-artifact@v4
        with:
          name: NKG_v26_cloudflared
          path: out/cloudflared.exe
          retention-days: 1
          compression-level: 0
