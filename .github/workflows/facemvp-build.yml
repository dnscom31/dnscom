name: Face MVP Android Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'facemvp/**'
      - '.github/workflows/facemvp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: facemvp
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FaceMVP-v0.1-debug
          path: facemvp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
